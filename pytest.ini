[pytest]
# Test discovery roots. Property/unit/integration/smoke/latency trees live
# under tests/; source is importable via the src layout (see pyproject.toml).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for the test tiers described in the design's Testing Strategy.
# Registering them keeps `--strict-markers` clean and lets CI select a tier,
# e.g. `pytest -m property` or `pytest -m "not latency"`.
markers =
    property: property-based tests (Hypothesis, >=100 iterations) validating a design correctness property
    integration: tests that exercise real/local infrastructure (e.g. DynamoDB-local) or cross-component propagation
    smoke: single-execution one-time configuration/architecture checks
    latency: timing/perf tests measured against a Nova Sonic test stream

addopts = --strict-markers -ra
